name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Genera el Prisma Client (tipos de las tablas). Sin esto, typecheck falla
      # porque el namespace Prisma no expone los tipos generados. No conecta a la DB.
      - name: Generate Prisma Client
        run: pnpm --filter @vacker/api exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # ===========================================================================
  # Aislamiento multi-tenant. Job aparte y con base de datos de verdad.
  #
  # Antes, el test de aislamiento vivía en el repo pero NO corría en CI: el job
  # de calidad no escribe .env, y sin DIRECT_URL la suite se saltaba sola. Once
  # comprobaciones en verde sin haberse ejecutado nunca. Una protección que no
  # se ejecuta no protege, y por eso esto es un job propio y bloqueante.
  #
  # La base es un Postgres descartable levantado acá. NUNCA la productiva: el
  # test siembra y borra filas, y el propio spec rechaza cualquier URL que
  # apunte a Supabase.
  # ===========================================================================
  aislamiento:
    name: Aislamiento multi-tenant
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pruebas
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Directa (5432): migraciones, siembra y limpieza.
      TEST_DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/pruebas
      # Por el pooler (6543) y en modo transaction, que es como se conecta la
      # API en producción. Es la mitad del punto de este job.
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:6543/pruebas?pgbouncer=true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @vacker/api exec prisma generate

      # En Supabase el rol `authenticated` viene de fábrica; en un Postgres
      # pelado no existe, y las migraciones le hacen GRANT. Sin esto, la primera
      # migración falla.
      - name: Crear el rol authenticated
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d pruebas \
            -c "CREATE ROLE authenticated NOLOGIN;"

      - name: Aplicar migraciones
        run: pnpm --filter @vacker/api exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DIRECT_URL }}
          DIRECT_URL: ${{ env.TEST_DIRECT_URL }}

      # El pooler en modo transaction. Va con un lote chico a propósito
      # (default_pool_size = 5): con 20 transacciones en paralelo, garantiza que
      # varias compartan la misma conexión física. Es justamente lo que hace que
      # el test de concurrencia signifique algo — si cada transacción tuviera su
      # propia conexión, no probaría que `is_local` limpia lo que dejó la
      # anterior.
      - name: Levantar PgBouncer en modo transaction
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq pgbouncer
          mkdir -p /tmp/pgb
          cat > /tmp/pgb/pgbouncer.ini <<'EOF'
          [databases]
          pruebas = host=127.0.0.1 port=5432 dbname=pruebas user=postgres password=postgres

          [pgbouncer]
          listen_addr = 127.0.0.1
          listen_port = 6543
          auth_type = trust
          auth_file = /tmp/pgb/userlist.txt
          pool_mode = transaction
          max_client_conn = 200
          default_pool_size = 5
          logfile = /tmp/pgb/pgbouncer.log
          pidfile = /tmp/pgb/pgbouncer.pid
          ignore_startup_parameters = extra_float_digits,search_path,options
          EOF
          echo '"postgres" "postgres"' > /tmp/pgb/userlist.txt
          pgbouncer -d /tmp/pgb/pgbouncer.ini
          for i in $(seq 1 20); do
            PGPASSWORD=postgres psql -h 127.0.0.1 -p 6543 -U postgres -d pruebas -c 'select 1' >/dev/null 2>&1 && break
            sleep 1
          done
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 6543 -U postgres -d pruebas -c 'select 1'

      - name: Aislamiento entre inmobiliarias y guardia de RLS
        run: pnpm --filter @vacker/api exec vitest run test/aislamiento.e2e-spec.ts test/rls-habilitada.e2e-spec.ts

      - name: Registro de PgBouncer si algo falla
        if: failure()
        run: cat /tmp/pgb/pgbouncer.log || true

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @vacker/api exec prisma generate

      # Valores de mentira a propósito: estos tests NO se loguean ni tocan la
      # base, solo verifican lo que se sirve sin sesión. Así el CI no necesita
      # ningún secreto y, sobre todo, no puede tocar los datos de producción —
      # que hoy viven en un plan sin backups automáticos.
      - name: Variables de entorno de prueba
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql://u:p@localhost:5432/x
          DIRECT_URL=postgresql://u:p@localhost:5432/x
          SUPABASE_URL=https://ejemplo.supabase.co
          SUPABASE_ANON_KEY=clave-de-mentira
          SUPABASE_SERVICE_ROLE_KEY=clave-de-mentira
          API_PORT=3001
          NEXT_PUBLIC_API_URL=http://localhost:3001
          NEXT_PUBLIC_SUPABASE_URL=https://ejemplo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY=clave-de-mentira
          WEB_APP_URL=http://localhost:3210
          EOF

      # `...` incluye las dependencias: sin compilar `@vacker/types` y compañía
      # primero, el build de la web no las encuentra. En local pasaba
      # desapercibido porque el `dist` ya estaba de antes.
      - name: Build web
        run: pnpm turbo run build --filter=@vacker/web...

      # Descargar Chromium y WebKit tarda ~50s, y era el paso más lento de todo
      # el CI. La clave lleva la versión de Playwright dentro: cuando se
      # actualiza la librería, los navegadores tienen que ser otros, y una clave
      # fija serviría binarios viejos con una librería nueva.
      - name: Versión de Playwright
        id: playwright
        run: echo "version=$(node -p "require('./apps/web/package.json').devDependencies['@playwright/test'].replace('^','')")" >> "$GITHUB_OUTPUT"

      - name: Caché de navegadores
        id: cache-navegadores
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Las dependencias del sistema son paquetes de Ubuntu: no se cachean y
      # hay que instalarlas siempre.
      #
      # Se probó sacarlas —la imagen de ubuntu-latest trae bastante— y los
      # tests fallan al abrir el navegador. Son 37 segundos por corrida y no
      # hay forma de evitarlos sin cambiar a la imagen Docker de Playwright,
      # que traería sus propias complicaciones. No volver a intentarlo.
      - name: Dependencias del sistema
        run: pnpm --filter @vacker/web exec playwright install-deps chromium webkit


      # La descarga de los navegadores, en cambio, se saltea entera cuando el
      # caché acierta. Antes esto y el paso de arriba iban juntos en un
      # `--with-deps`, y el caché no servía de nada porque el comando corría
      # igual.
      #
      # WebKit además de Chromium: el "baile" era un comportamiento propio de
      # Safari, así que probarlo solo en Chrome no habría servido de nada.
      - name: Descargar navegadores
        if: steps.cache-navegadores.outputs.cache-hit != 'true'
        run: pnpm --filter @vacker/web exec playwright install chromium webkit

      - name: End to end
        run: pnpm --filter @vacker/web test:e2e

      # El sitio comercial no necesita ni base ni secretos: son cinco páginas
      # estáticas y un formulario. Va aparte porque es lo primero que ve un
      # prospecto, y si en su teléfono se arrastra de costado la conversación
      # empieza perdida — ya pasó una vez con el botón del encabezado.
      # Solo las dependencias (el `^` de turbo): el build del sitio en sí lo
      # hace `test:e2e`, que compila en `.next-e2e` para no pisar un `next dev`
      # abierto. Compilarlo acá también sería hacer el mismo trabajo dos veces.
      - name: Build de las dependencias del sitio
        run: pnpm turbo run build --filter=@vacker/sitio^...

      - name: End to end del sitio
        run: pnpm --filter @vacker/sitio test:e2e

      - name: Guardar el reporte si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/sitio/playwright-report/
          retention-days: 7
