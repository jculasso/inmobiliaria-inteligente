name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Genera el Prisma Client (tipos de las tablas). Sin esto, typecheck falla
      # porque el namespace Prisma no expone los tipos generados. No conecta a la DB.
      - name: Generate Prisma Client
        run: pnpm --filter @vacker/api exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @vacker/api exec prisma generate

      # Valores de mentira a propósito: estos tests NO se loguean ni tocan la
      # base, solo verifican lo que se sirve sin sesión. Así el CI no necesita
      # ningún secreto y, sobre todo, no puede tocar los datos de producción —
      # que hoy viven en un plan sin backups automáticos.
      - name: Variables de entorno de prueba
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql://u:p@localhost:5432/x
          DIRECT_URL=postgresql://u:p@localhost:5432/x
          SUPABASE_URL=https://ejemplo.supabase.co
          SUPABASE_ANON_KEY=clave-de-mentira
          SUPABASE_SERVICE_ROLE_KEY=clave-de-mentira
          API_PORT=3001
          NEXT_PUBLIC_API_URL=http://localhost:3001
          NEXT_PUBLIC_SUPABASE_URL=https://ejemplo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY=clave-de-mentira
          WEB_APP_URL=http://localhost:3210
          EOF

      # `...` incluye las dependencias: sin compilar `@vacker/types` y compañía
      # primero, el build de la web no las encuentra. En local pasaba
      # desapercibido porque el `dist` ya estaba de antes.
      - name: Build web
        run: pnpm turbo run build --filter=@vacker/web...

      # Descargar Chromium y WebKit tarda ~50s, y era el paso más lento de todo
      # el CI. La clave lleva la versión de Playwright dentro: cuando se
      # actualiza la librería, los navegadores tienen que ser otros, y una clave
      # fija serviría binarios viejos con una librería nueva.
      - name: Versión de Playwright
        id: playwright
        run: echo "version=$(node -p "require('./apps/web/package.json').devDependencies['@playwright/test'].replace('^','')")" >> "$GITHUB_OUTPUT"

      - name: Caché de navegadores
        id: cache-navegadores
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Las dependencias del sistema son paquetes de Ubuntu: no se cachean y
      # hay que instalarlas siempre.
      #
      # Se probó sacarlas —la imagen de ubuntu-latest trae bastante— y los
      # tests fallan al abrir el navegador. Son 37 segundos por corrida y no
      # hay forma de evitarlos sin cambiar a la imagen Docker de Playwright,
      # que traería sus propias complicaciones. No volver a intentarlo.
      - name: Dependencias del sistema
        run: pnpm --filter @vacker/web exec playwright install-deps chromium webkit


      # La descarga de los navegadores, en cambio, se saltea entera cuando el
      # caché acierta. Antes esto y el paso de arriba iban juntos en un
      # `--with-deps`, y el caché no servía de nada porque el comando corría
      # igual.
      #
      # WebKit además de Chromium: el "baile" era un comportamiento propio de
      # Safari, así que probarlo solo en Chrome no habría servido de nada.
      - name: Descargar navegadores
        if: steps.cache-navegadores.outputs.cache-hit != 'true'
        run: pnpm --filter @vacker/web exec playwright install chromium webkit

      - name: End to end
        run: pnpm --filter @vacker/web test:e2e

      # El sitio comercial no necesita ni base ni secretos: son cinco páginas
      # estáticas y un formulario. Va aparte porque es lo primero que ve un
      # prospecto, y si en su teléfono se arrastra de costado la conversación
      # empieza perdida — ya pasó una vez con el botón del encabezado.
      # Solo las dependencias (el `^` de turbo): el build del sitio en sí lo
      # hace `test:e2e`, que compila en `.next-e2e` para no pisar un `next dev`
      # abierto. Compilarlo acá también sería hacer el mismo trabajo dos veces.
      - name: Build de las dependencias del sitio
        run: pnpm turbo run build --filter=@vacker/sitio^...

      - name: End to end del sitio
        run: pnpm --filter @vacker/sitio test:e2e

      - name: Guardar el reporte si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/sitio/playwright-report/
          retention-days: 7
