name: Reporte semanal del Protocolo

# Lunes a las 11:00 UTC = 8:00 en Argentina. Se manda a primera hora del lunes
# porque es cuando la dirección decide la semana; un reporte que llega el
# viernes se lee cuando ya no se puede hacer nada con él.
#
# Los cron de GitHub Actions NO son puntuales: bajo carga se atrasan y pueden
# saltar corridas. Para un reporte semanal media hora de diferencia no cambia
# nada, pero por eso mismo NO se usa esto para nada que dependa del minuto.
on:
  schedule:
    - cron: '0 11 * * 1'
  # Para poder dispararlo a mano desde la pestaña Actions sin esperar al lunes.
  workflow_dispatch:

jobs:
  enviar:
    name: Enviar el reporte a cada inmobiliaria
    runs-on: ubuntu-latest
    # Despertar (hasta ~2 min con reintentos) + enviar (hasta 3 min): 10 corta
    # un cuelgue sin quedar justo.
    timeout-minutes: 10
    steps:
      # La API vive en el free tier de Render y se duerme: el primer request
      # después de dormir tarda 50s o más. Por eso el timeout es generoso y hay
      # reintentos — sin esto la tarea fallaba justamente los lunes temprano,
      # que es cuando lleva más rato sin tráfico. Reintentar /health no tiene
      # efectos: es un GET.
      - name: Despertar la API
        run: curl -fsS --max-time 120 --retry 3 --retry-delay 15 https://api.inmobiliariainteligente.net/health

      # El POST va SIN --retry: no es idempotente. Si la API manda los mails y
      # la respuesta se corta (timeout, 502 del proxy), un reintento manda el
      # reporte por segunda vez a toda la dirección. Mejor una corrida roja que
      # se mira y se relanza a mano que un mail duplicado.
      #
      # Solo se imprimen CONTEOS. El repositorio es público y los logs de
      # Actions también: la respuesta trae el nombre de cada inmobiliaria y el
      # motivo de cada falla, y eso no puede quedar a la vista de cualquiera.
      # El detalle está en los logs de Render.
      - name: Enviar los reportes
        run: |
          respuesta=$(curl -fsS --max-time 180 \
            -X POST https://api.inmobiliariainteligente.net/tareas/reporte-semanal \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}")
          echo "$respuesta" | python3 -c "import json,sys; d=json.load(sys.stdin); fallas=sum(1 for x in d['detalle'] if not x['enviado']); print(f\"{d['enviados']}/{d['tenants']} inmobiliarias con envío, {fallas} sin envío (detalle en los logs de Render)\")"
